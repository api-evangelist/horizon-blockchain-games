type: Webhooks
summary: >-
  Sequence exposes a webhook surface through the Indexer service: developers register webhook
  listeners that receive push notifications when on-chain events (native/token balance updates,
  transactions) matching a filter occur for their project. Listeners are managed via the Indexer
  webrpc API and delivered to a developer-supplied HTTPS endpoint. The Builder API additionally
  manages project-level webhook configuration.
delivery:
  transport: https-post
  auth: developer endpoint receives POST callbacks; listeners registered with project access key
