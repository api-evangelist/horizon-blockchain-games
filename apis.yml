aid: horizon-blockchain-games
name: Horizon Blockchain Games
description: >-
  Horizon Blockchain Games is the web3 gaming studio and infrastructure company behind Skyweaver and
  the Sequence platform (sequence.xyz / 0xsequence) — a modular, open-source web3 development stack
  for onchain apps, DeFi, stablecoins, and games. Sequence unifies smart-contract wallets, embedded
  Wallet-as-a-Service, 1-click cross-chain payments, an NFT marketplace, a multi-chain indexer,
  token metadata, a transaction relayer with gas sponsorship, a node gateway, analytics, and SDKs
  for Web, Unity, Unreal, React Native, and Go. Its APIs are webrpc JSON-RPC-over-HTTP services
  spanning 40+ EVM chains, authenticated with project access keys. Sequence was acquired by Polygon
  Labs. This profile was enriched by the API Evangelist pipeline from Sequence's public developer
  surface.
